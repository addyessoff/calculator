<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- 文字コードの指定 -->
    <meta charset="UTF-8">
    <!-- スマホなどへの表示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- タブ名 -->
    <title>My Calculate Website</title>
    <!-- CSSの指定 -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>計算機のサイト</h1>
    <div class="calculator-add">
        <h2>1.加算機</h2>
        <h3>入力欄</h3>
        <input type="number" id="num1">
        <input type="number" id="num2">
        <button onclick="calculate()">計算</button>
        <h3>計算結果</h3>
        <p id="result">入力されていません</p>
    </div>
    <div class="calculator-add">
        <h2>2.割引計算</h2>
        <h3>入力欄</h3>
        <input type="number" id="price" placeholder="元の金額">
        <input type="number" id="discount" placeholder="割引率(%)">
        <button onclick="calculate_discount()">計算</button>
        <h3>計算結果</h3>
        <p><span class="label">割引額　　　：</span><span id="result_discountedPrice">入力されていません</span></p>
        <p><span class="label">お得した金額：</span><span id="result_discountAmount">入力されていません</span></p>
    </div>
    <div class="calculater-nisa">
        <h2>3.NISA積立シュミレーター</h2>
        <h3>入力欄</h3>
        <p>毎月の積立額(万円)</p>
        <input type="number" id="investment" min=0 placeholder="毎月の積立額">
        <p>積立期間(年)</p>
        <input type="number" id="years" min=0 placeholder="積立期間">
        <p>想定利回り(%)</p>
        <input type="number" id="percent" placeholder="想定利回り">
        <p>
        <button onclick="calculate_nisa()">計算</button>
        </p>
        <h3>計算結果</h3>
        <p><span class="label">元本（積立した金額）：</span><span id ="result_sum">入力されていません</span></p>
        <p><span class="label">運用益（利益）　　　：</span><span id="result_profit">入力されていません</span></p>
        <p><span class="label">総資産額（総額）　　：</span><span id="result_total">入力されていません</span></p>
        <p>© 2026/10/03 My Calculate Website</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
